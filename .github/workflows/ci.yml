name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Permet au workflow de deploiement de reutiliser exactement les memes controles.
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      # `npm run build` lance `tsc -b` : le typage est verifie ici.
      - name: Build
        run: npm run build
